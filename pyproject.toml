[project]
name = "stockcopy"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sampleless0", email = "Sampleless0@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "torch>=2.14.1",
    "zstandard>=0.25.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[project.scripts]
stockcopy = "stockcopy:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
